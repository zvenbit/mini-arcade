# Merge these locations into the EXISTING arcade.venai.cn server block.
# Keep existing root, TLS, and other sites unchanged.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:46175;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    client_max_body_size 4k;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
# Do not serve repository internals or deployment files.
# Leave ACME certificate renewal paths available.
location ~ /\.(?!well-known/) { deny all; }
location ~ ^/(server|tests|deploy)/ { deny all; }
location ~* \.(sqlite3?|db)(-wal|-shm)?$ { deny all; }
# Replace an existing equivalent cache block, rather than duplicating it.
location ~* \.(html|js|css|json)$ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}
