<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201b27"><meta name="description" content="Climb from Tibo’s basement to the rooftop reset button. Try Nightmare for a checkpoint-free ascent.">
<title>Rooftop Reset · Tibo Arcade</title><link rel="icon" href="assets/mark.svg"><link rel="stylesheet" href="arcade.css">
</head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-flag" viewBox="0 0 20 20"><path d="M4 18V3h12l-3 4 3 4H5"/></symbol>
<symbol id="i-skull" viewBox="0 0 20 20"><path d="M5 15H3V8l3-4h8l3 4v7h-2v3H5zM6 9h2v2H6zm6 0h2v2h-2zm-3 5h2"/></symbol>
<symbol id="i-clock" viewBox="0 0 20 20"><path d="M7 2h6m-3 1v2m6 1 2-2"/><circle cx="10" cy="12" r="6.5"/><path d="M10 8v4l2 1"/></symbol>
<symbol id="i-pause" viewBox="0 0 20 20"><path d="M7 4v12m6-12v12" stroke-width="3"/></symbol>
<symbol id="i-sound" viewBox="0 0 20 20"><path d="M2 8h4l4-4v12l-4-4H2zm11-2q4 4 0 8m3-11q6 7 0 14"/></symbol>
<symbol id="i-muted" viewBox="0 0 20 20"><path d="M2 8h4l4-4v12l-4-4H2zm11 0l5 5m0-5-5 5"/></symbol>
<symbol id="i-full" viewBox="0 0 20 20"><path d="M3 8V3h5m4 0h5v5m0 4v5h-5m-4 0H3v-5"/></symbol>
<symbol id="i-keys" viewBox="0 0 20 20"><path d="M2 5h16v10H2zM5 8h1m3 0h1m3 0h1m-8 4h8"/></symbol>
<symbol id="i-dash" viewBox="0 0 20 20"><path d="M2 5l5 5-5 5m7-10 5 5-5 5" stroke-width="2.6"/></symbol>
<symbol id="i-jump" viewBox="0 0 20 20"><path d="M10 17V4m-6 6 6-6 6 6" stroke-width="2.6"/></symbol>
<symbol id="i-play" viewBox="0 0 20 20"><path d="m6 3 10 7-10 7z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-retry" viewBox="0 0 20 20"><path d="M3 4v5h5M3 9a7 7 0 1 1 1.5 6"/></symbol>
<symbol id="i-climb" viewBox="0 0 20 20"><path d="M2 16h5v-5h5V6h6M13 2h5v5"/></symbol>
</svg>
<main id="arcade" aria-label="Rooftop Reset game">
<canvas id="game" width="480" height="270" tabindex="-1" aria-label="Playable tower. Run, crouch, jump and dash to the rooftop reset."></canvas>
<img id="hero-poses" hidden fetchpriority="high" src="assets/tibo-athlete.webp" alt="">
<img id="hero-moves" hidden src="assets/tibo-moves.webp" alt="">
<img id="terrier-poses" hidden fetchpriority="high" src="assets/terrier.webp" alt="">
<img id="mural-art" hidden src="assets/tower.webp" alt="">
<div class="hud" id="hud">
<div class="room"><span class="floor-id" id="floor-id">01 / 06</span><div><strong id="room">Basement</strong><small id="mode-badge">Hard</small></div></div>
<div class="run-stats"><span class="stat" title="Deaths" aria-label="Deaths"><svg aria-hidden="true"><use href="#i-skull"/></svg><b id="deaths">0</b></span><span class="stat" title="Run time" aria-label="Run time"><svg aria-hidden="true"><use href="#i-clock"/></svg><b id="timer">0:00</b></span><button class="pause-btn" id="pause" aria-label="Pause and settings" title="Pause (Esc)"><svg aria-hidden="true"><use href="#i-pause"/></svg></button></div>
</div>
<section id="entry" aria-label="Choose a climb">
<h1><img src="assets/title.svg" alt="Rooftop Reset" draggable="false"></h1>
<p class="premise">Tibo was too mean. They locked him in the basement. His reset button is on the roof.</p>
<div class="choices" id="start-choices" role="group" aria-label="Start a climb">
<button data-difficulty="hard" class="choice hard"><svg aria-hidden="true"><use href="#i-flag"/></svg><span><b>Hard</b><small>Floor checkpoints</small></span></button>
<button data-difficulty="nightmare" class="choice nightmare"><svg aria-hidden="true"><use href="#i-skull"/></svg><span><b>Nightmare</b><small>No checkpoints</small></span></button>
</div>
<p id="quick-hint" class="quick-hint"></p>
</section>
<div id="dash-state" class="dash-state" hidden><i></i> Dash</div>
<button id="roof-action" class="roof-action" type="button" aria-label="Press the rooftop reset button and open ChatGPT" hidden><span>Press reset</span></button>
<div id="touch-pad" class="touch-pad" hidden>
  <div id="stick" class="stick" role="slider" tabindex="0" aria-label="Movement joystick. Pull down to crouch." aria-orientation="horizontal" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Centered">
    <span class="stick-tick west" aria-hidden="true">‹</span><span class="stick-tick east" aria-hidden="true">›</span>
    <span class="stick-tick south" aria-hidden="true">⌄</span>
    <span class="stick-knob" aria-hidden="true"></span>
  </div>
  <div class="touch-actions" role="group" aria-label="Jump and dash">
    <button type="button" data-key="dash" class="touch-dash" aria-label="Dash"><svg aria-hidden="true"><use href="#i-dash"/></svg><small>Dash</small></button>
    <button type="button" data-key="jump" class="touch-jump" aria-label="Jump"><svg aria-hidden="true"><use href="#i-jump"/></svg><small>Jump</small></button>
  </div>
</div>
<div id="notice" class="notice" aria-hidden="true" hidden></div>
<div id="overlay" class="overlay" hidden>
<section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
<small class="kicker" id="dialog-kicker"></small><h2 id="dialog-title">Paused</h2><p id="dialog-text"></p>
<div id="dialog-choices" class="choices" role="group" aria-label="Start a new climb" hidden></div>
<div class="menu-grid">
<button id="primary" class="primary"><svg aria-hidden="true"><use href="#i-play"/></svg><span>Resume</span></button>
<button id="retry" class="secondary" hidden><svg aria-hidden="true"><use href="#i-retry"/></svg><span>Retry</span></button>
<button id="secondary" class="secondary" hidden><svg aria-hidden="true"><use href="#i-climb"/></svg><span>New climb</span></button>
<div id="tools" class="menu-tools" hidden>
<button id="help"><svg aria-hidden="true"><use href="#i-keys"/></svg><span>Controls</span></button>
<button id="sound" aria-pressed="true"><svg aria-hidden="true"><use href="#i-sound"/></svg><span>Sound on</span></button>
<button id="full"><svg aria-hidden="true"><use href="#i-full"/></svg><span>Fullscreen</span></button>
</div></div>
</section></div>
<div id="announce" class="sr" role="status" aria-live="polite"></div>
</main><script src="engine.js" defer></script><script src="render.js" defer></script><script src="touch.js" defer></script><script src="score.js" defer></script><script src="arcade.js" defer></script>
</body></html>
