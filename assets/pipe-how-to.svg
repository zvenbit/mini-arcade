<text x="47" y="63" text-anchor="middle" fill="white" font-size="22" font-weight="bold">→</text><text x="410" y="208" text-anchor="middle" fill="#6f4d21" font-size="25" font-weight="bold">✓</text>
<g font-family="system-ui,sans-serif" font-size="17" font-weight="bold" text-anchor="middle"><text x="47" y="105" fill="#1c739d">① 进水</text><text x="410" y="152" fill="#92642a">② 出水</text></g>
<text x="220" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#4a705f">蓝色水流接通两端，就算通关！</text>
