<rect x="116" y="167" width="67" height="66" rx="9"/><rect x="187" y="167" width="67" height="66" rx="9"/><rect x="258" y="167" width="66" height="66" rx="9"/>
</g>
<g fill="none" stroke="#407b6c" stroke-width="13" stroke-linecap="round" opacity=".5"><path d="M280 39V70H308M132 115H164M131 182V215M288 112V150"/></g>
<path d="M49 59H201Q220 59 220 79V180Q220 200 240 200H410" fill="none" stroke="#735229" stroke-width="28" stroke-linejoin="round"/>
